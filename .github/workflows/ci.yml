name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          pytest -v --durations=10

      - name: Run Benchmark Evaluation Script
        run: |
          python evaluate.py

      - name: Upload Evaluation Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evaluation-report
          path: eval_report.json
          retention-days: 14

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
