name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-dev.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-api.txt -r backend/requirements-dev.txt

      - name: Run Ruff Lint
        working-directory: backend
        run: |
          ruff check app tests

      - name: Run Pytest Unit Suite
        working-directory: backend
        run: |
          pytest -v -m "not eval" --durations=10

  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: |
          npm run lint

      - name: Typecheck Frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit

  rag-evals:
    name: DeepEval RAG Suite
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-dev.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-api.txt -r backend/requirements-dev.txt

      - name: Run DeepEval Suite
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            pytest -v tests/evals
          else
            echo "OPENAI_API_KEY secret not configured; skipping DeepEval suite."
          fi
